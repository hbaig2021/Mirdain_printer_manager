[project]
name = "local-print-farm"
version = "0.3.0"
description = "Local-first 3D printer fleet management, file delivery, and job control."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "keyring>=25,<26",
  "python-multipart>=0.0.20,<1.0",
  "requests>=2.32,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
