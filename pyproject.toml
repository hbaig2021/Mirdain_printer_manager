[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mirdain-print-hub"
version = "0.4.0"
description = "Local-first 3D printer fleet management, file delivery, and job control."
readme = "README.md"
license = "MIT"
authors = [{ name = "Hamza Baig" }]
requires-python = ">=3.11"
dependencies = [
  "cryptography>=48.0.1,<51",
  "fastapi>=0.115,<1.0",
  "keyring>=25,<26",
  "python-multipart>=0.0.20,<1.0",
  "requests>=2.32,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.urls]
Homepage = "https://github.com/hbaig2021/Mirdain_printer_manager"
Issues = "https://github.com/hbaig2021/Mirdain_printer_manager/issues"
Source = "https://github.com/hbaig2021/Mirdain_printer_manager"

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["backend.tests*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
