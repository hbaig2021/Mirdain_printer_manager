server {
    listen 80 default_server;
    listen [::]:80 default_server;
    default_type application/octet-stream;
    server_name "";
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1 ${MIRDAIN_ALLOWED_HOSTS};

    client_max_body_size 520m;

    # A location that declares any add_header stops inheriting the server-level
    # add_header set, so the docs locations repeat these shared headers by include.
    include /etc/nginx/mirdain-security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: http: https:; media-src 'self' blob: http: https:; connect-src 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location = /docs {
        proxy_pass http://api:8765/docs;
        proxy_set_header Host $http_host;
        include /etc/nginx/mirdain-security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css; font-src 'self' data:; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'" always;
    }

    location = /redoc {
        proxy_pass http://api:8765/redoc;
        proxy_set_header Host $http_host;
        include /etc/nginx/mirdain-security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/redoc@2/bundles/redoc.standalone.js; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'" always;
    }

    location = /openapi.json {
        proxy_pass http://api:8765/openapi.json;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
