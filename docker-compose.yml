name: mirdain-print-hub

services:
  api:
    build:
      context: .
      target: backend
    restart: unless-stopped
    environment:
      MIRDAIN_SECRET_KEY: ${MIRDAIN_SECRET_KEY:-}
      MIRDAIN_API_TOKEN: ${MIRDAIN_API_TOKEN:-}
      MIRDAIN_ALLOWED_HOSTS: ${MIRDAIN_ALLOWED_HOSTS:-}
    volumes:
      - mirdain-data:/app/backend/data
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=2)
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5

  web:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      MIRDAIN_ALLOWED_HOSTS: ${MIRDAIN_ALLOWED_HOSTS:-}
    ports:
      - "${MIRDAIN_BIND_ADDRESS:-127.0.0.1}:${MIRDAIN_WEB_PORT:-8080}:80"

volumes:
  mirdain-data:
